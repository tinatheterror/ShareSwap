name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Typecheck error counts on main today. A change fails CI only by going above these; lower them as errors are fixed.
  TYPECHECK_BASELINE_API: "338"
  TYPECHECK_BASELINE_WEB: "29"
  TYPECHECK_BASELINE_MOBILE: "25"
  # The test guard refuses any database but this one.
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/shareswap_test
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/shareswap_test

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shareswap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Push the schema to the test database
        run: pnpm --filter @workspace/db run push-force
      - name: Build library typings
        run: pnpm run typecheck:libs

      - name: API unit tests
        run: pnpm --filter @workspace/api-server run test
      - name: Web unit tests
        run: pnpm --filter @workspace/shareswap run test
      - name: Mobile unit tests
        run: pnpm --filter @workspace/shareswap-mobile run test

      - name: Typecheck (api, web, mobile) against the baselines
        if: ${{ !cancelled() }}
        run: |
          status=0
          check() {
            name=$1; dir=$2; baseline=$3
            (cd "$dir" && pnpm exec tsc -p tsconfig.json --noEmit > "$RUNNER_TEMP/tsc-$name.txt" 2>&1) || true
            count=$(grep -c "error TS" "$RUNNER_TEMP/tsc-$name.txt" || true)
            echo "$name: $count type errors (baseline $baseline)"
            if [ "$count" -gt "$baseline" ]; then
              echo "::error::$name has $count type errors, above the baseline of $baseline"
              grep "error TS" "$RUNNER_TEMP/tsc-$name.txt" | head -n 40
              status=1
            fi
          }
          check api artifacts/api-server "$TYPECHECK_BASELINE_API"
          check web artifacts/shareswap "$TYPECHECK_BASELINE_WEB"
          check mobile artifacts/shareswap-mobile "$TYPECHECK_BASELINE_MOBILE"
          exit $status

      - name: Install Chromium for Playwright
        if: ${{ !cancelled() }}
        working-directory: artifacts/shareswap
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright e2e
        if: ${{ !cancelled() }}
        working-directory: artifacts/shareswap
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")
          pnpm exec playwright test --reporter=line,html
      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            artifacts/shareswap/playwright-report
            artifacts/shareswap/test-results
          if-no-files-found: ignore
          retention-days: 14
