packages:
  - artifacts/*

# The archive is not part of the live workspace. Keep its restore graph patched
# independently rather than retaining stale npm locks alongside pnpm.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@replit/*'
  - stripe-replit-sync

patchedDependencies:
  deepmerge@4.3.1: ../patches/deepmerge@4.3.1.patch

overrides:
  '@esbuild-kit/esm-loader': npm:tsx@^4.22.4
  esbuild: 0.28.1
  axios@<1.20.0: ^1.20.0
  body-parser@>=1.0.0 <2.0.0: ^1.20.9
  body-parser@>=2.0.0 <2.4.0: ^2.4.0
  proxy-addr@<2.0.8: ^2.0.8
  postcss@<8.5.23: ^8.5.23
  postcss-selector-parser@<6.1.5: ^6.1.5
  source-map-js@<1.2.2: ^1.2.2
  nanoid@<3.3.18: ^3.3.18
  browserslist@<4.28.7: ^4.28.7
  baseline-browser-mapping@<2.11.0: ^2.11.0
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  fast-xml-parser@<5.10.1: ^5.10.1
  ip-address@<10.7.4: ^10.7.4
