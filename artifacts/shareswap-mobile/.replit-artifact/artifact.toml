kind = "mobile"
previewPath = "/mobile/"
title = "ShareSwap Mobile"
version = "1.0.0"
id = "artifacts/shareswap-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 18883

[services.development]
run = "pnpm --filter @workspace/shareswap-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shareswap-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/shareswap-mobile", "run", "serve" ]

[services.env]
PORT = "18883"
BASE_PATH = "/mobile/"
