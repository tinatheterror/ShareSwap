kind = "web"
previewPath = "/"
title = "ShareSwap"
version = "1.0.0"
id = "artifacts/shareswap"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19887

[services.development]
run = "pnpm --filter @workspace/shareswap run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shareswap", "run", "build" ]
publicDir = "artifacts/shareswap/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19887"
BASE_PATH = "/"
